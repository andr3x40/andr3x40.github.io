<div class="header-container p-3">
    <div class="card font-mono">
        <p-menubar [model]="items" [dt]="navbar">
            <ng-template #start>
                <p-button class="m-0 p-0 font-black" [rounded]="true" variant="text" [dt]="navbarButton" [routerLink]="'/'">
                    andr3x40's Lab
                </p-button>
                <p-divider layout="vertical"></p-divider>
            </ng-template>
            <ng-template #item let-item let-root="root">
                <a class="p-menubar-item-link flex items-center" [routerLink]="item.routerLink">
                    <div class="flex items-center px-2 gap-2">
                        <span>{{ item.label }}</span>
                        @if (item.badge > 0) {
                            <span class="text-primary-400">({{ item.badge }})</span>
                        }
                        @if (item.items) {
                            <i [ngClass]="['ml-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
                        }
                    </div>
                </a>
            </ng-template>
            <ng-template #end>
                @if (this.user === undefined) {
                    <p-skeleton height="2rem" width="5rem" borderRadius="16px" />
                } @else if (this.user === null) {
                    <div class="flex items-center gap-2">
                        <p-button class="m-0 p-0 font-black" [rounded]="true" variant="text" [dt]="navbarButton" [routerLink]="'/login'">
                            Login
                        </p-button>
                    </div>
                }
                @else {
                    <div class="flex items-center gap-2">
                        <p-button class="m-0 p-0 font-black" [rounded]="true" variant="text" [dt]="navbarButton" [routerLink]="'/home'">
                            {{ this.user.name }}
                        </p-button>
                    </div>
                }
            </ng-template>
        </p-menubar>
    </div>
</div>
